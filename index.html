<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Goals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E8E4DA;
    --surface: #F4F2EB;
    --ink: #23241F;
    --ink-soft: #6B6858;
    --line: #CFC8B6;
    --weekday: #33517A;
    --weekday-soft: #DCE3EC;
    --weekend: #B5622A;
    --weekend-soft: #F0E0D2;
    --done: #4B7355;
  }
  *{ box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 20px;
  }
  .nav-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1;
    padding: 6px 8px;
    cursor:pointer;
    border-radius: 4px;
  }
  .nav-btn:hover{ color: var(--ink); }
  .nav-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .week-label{
    font-family: 'Fraunces', serif;
    font-size: 27px;
    font-weight: 500;
    font-optical-sizing: auto;
    text-align:center;
    flex: 1;
  }
  .tabs{
    display:flex;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    padding: 10px 4px 12px;
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
    text-align:center;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab .t-name{ font-size:15px; font-weight:600; display:block; }
  .tab .t-count{ font-size:12px; margin-top:2px; display:block; }
  .tab.active{ color: var(--ink); }
  .tab[data-tab="weekday"].active{ border-color: var(--weekday); }
  .tab[data-tab="weekend"].active{ border-color: var(--weekend); }
  .tab:focus-visible{ outline: 2px solid var(--ink); outline-offset: -2px; }

  .day-row{
    display:flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .day-btn{
    flex:1;
    min-width: 0;
    background:none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 2px;
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
    color: var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
    white-space:nowrap;
  }
  .day-btn .d-name{ font-size: 12.5px; font-weight:600; }
  .day-btn .d-date{ font-size: 10px; opacity: .8; }
  .day-btn .d-count{ font-size: 10.5px; }
  .day-btn .d-count.all-done{ color: var(--done); }
  .day-btn.active.weekday{ background: var(--weekday-soft); border-color: var(--weekday); color: var(--weekday); }
  .day-btn.active.weekend{ background: var(--weekend-soft); border-color: var(--weekend); color: var(--weekend); }
  .day-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .progress-track{
    flex:1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  .progress-pct{
    font-size: 11.5px;
    color: var(--ink-soft);
    min-width: 30px;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .progress-pct.all-done{ color: var(--done); font-weight:600; }
  .progress-fill{
    height:100%;
    width:0%;
    transition: width .35s ease;
  }
  .progress-fill.weekday{ background: var(--weekday); }
  .progress-fill.weekend{ background: var(--weekend); }

  .copy-banner{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .copy-banner .copy-text{ flex:1; }
  .copy-banner button#copyPrev{
    background: var(--ink);
    color: var(--surface);
    border:none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    font-family: 'Libre Franklin', sans-serif;
  }
  .copy-dismiss{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 14px;
    line-height:1;
    padding: 4px 2px;
    cursor:pointer;
  }
  .copy-dismiss:hover{ color: var(--ink); }

  .category-group{ margin-bottom: 18px; }
  .category-name{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .goal-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .goal-check{
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 3px;
    flex-shrink:0;
    margin-top: 2px;
    cursor:pointer;
    background: none;
    padding:0;
    position:relative;
  }
  /* Visual box stays 18px, but the tap target extends into the surrounding
     padding — 18px alone is too small to hit reliably on a phone. */
  .goal-check::before{
    content:"";
    position:absolute;
    top:-11px; bottom:-11px; left:-10px; right:-6px;
  }
  .goal-check.checked{ background: var(--done); border-color: var(--done); }
  .goal-check.checked::after{
    content:"";
    position:absolute;
    left:4px; top:1px;
    width:5px; height:9px;
    border: solid var(--surface);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .goal-text{
    flex:1;
    font-size: 15px;
    line-height:1.4;
    cursor:pointer;
  }
  .goal-edit-input{
    flex:1;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 15px;
    line-height:1.4;
    padding: 0;
    border:none;
    border-bottom: 1.5px solid var(--ink-soft);
    background:none;
    color: var(--ink);
    min-width: 0;
  }
  .goal-edit-input:focus{ outline:none; border-bottom-color: var(--ink); }
  .goal-list{ min-height: 4px; }
  .sortable-ghost{ opacity: .35; }
  .sortable-chosen .goal-row{ background: var(--bg); border-radius: 4px; }
  .goal-text.done{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }
  .goal-del, .goal-move{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 15px;
    cursor:pointer;
    padding: 2px 6px;
    line-height:1;
  }
  .goal-del:hover, .goal-move:hover{ color: var(--ink); }
  .goal-move.open{ color: var(--ink); }

  .move-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 6px;
    padding: 8px 0 10px 28px;
  }
  .move-label{ font-size: 12px; color: var(--ink-soft); }
  .move-day{
    border: 1px solid var(--line);
    background:none;
    border-radius: 14px;
    padding: 4px 11px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .move-day:hover:not(:disabled){ border-color: var(--ink-soft); color: var(--ink); }
  .move-day:disabled{ opacity: .35; cursor:default; }

  .empty-state{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height:1.5;
    padding: 10px 0 24px;
  }

  .add-form{
    margin-top: 10px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .add-input{
    width:100%;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 15px;
    padding: 10px 2px;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: none;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .add-input:focus{
    outline:none;
    border-bottom-color: var(--ink);
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip{
    border: 1.5px solid var(--line);
    background: none;
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .chip.selected.weekday{ background: var(--weekday-soft); border-color: var(--weekday); color: var(--weekday); }
  .chip.selected.weekend{ background: var(--weekend-soft); border-color: var(--weekend); color: var(--weekend); }
  .chip-new-input{
    border: 1.5px solid var(--ink-soft);
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    font-family: 'Libre Franklin', sans-serif;
    background:none;
    color: var(--ink);
    width: 110px;
  }
  .chip-new-input:focus{ outline:none; }
  .add-submit{
    width:100%;
    border:none;
    border-radius: 6px;
    padding: 11px;
    font-size: 14.5px;
    font-weight: 600;
    cursor:pointer;
    color: var(--surface);
    font-family: 'Libre Franklin', sans-serif;
  }
  .add-submit.weekday{ background: var(--weekday); }
  .add-submit.weekend{ background: var(--weekend); }
  .add-submit:disabled{ background: var(--line); cursor:default; }

  .loading{
    text-align:center;
    color: var(--ink-soft);
    padding: 60px 0;
    font-size: 14px;
  }
  .signin{
    text-align:center;
    padding: 100px 20px;
  }
  .signin-title{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .signin-sub{
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .signin-btn{
    background: var(--ink);
    color: var(--surface);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .signout-link{
    background:none;
    border:none;
    color: var(--ink-soft);
    text-decoration: underline;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
    font-family: 'Libre Franklin', sans-serif;
  }
  .status-note{
    text-align:center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 24px;
  }

  /* Phone-sized column reads as stranded text on a monitor: on wider screens
     it becomes a centered card and everything scales up to match. */
  @media (min-width: 768px){
    body{
      display:flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .app{
      width: 100%;
      max-width: 620px;
      margin: auto;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 36px 40px 40px;
      box-shadow: 0 1px 3px rgba(35,36,31,.05), 0 12px 32px rgba(35,36,31,.07);
    }
    .nav-btn{ font-size: 22px; }
    .week-label{ font-size: 34px; }
    .header{ margin-bottom: 26px; }
    .tabs{ margin-bottom: 24px; }
    .tab{ padding: 12px 4px 14px; }
    .tab .t-name{ font-size: 17px; }
    .tab .t-count{ font-size: 13px; }
    .day-row{ gap: 8px; margin-bottom: 22px; }
    .day-btn{ padding: 9px 4px; border-radius: 10px; }
    .day-btn .d-name{ font-size: 13.5px; }
    .day-btn .d-date{ font-size: 11px; }
    .day-btn .d-count{ font-size: 11.5px; }
    .progress-row{ margin-bottom: 28px; }
    .progress-track{ height: 4px; }
    .progress-pct{ font-size: 12.5px; min-width: 34px; }
    .copy-banner{ background: var(--bg); font-size: 14.5px; padding: 14px 16px; }
    .category-name{ font-size: 14px; }
    .goal-row{ padding: 12px 0; gap: 12px; }
    .goal-check{ width: 20px; height: 20px; }
    .goal-check.checked::after{ left:5px; top:2px; width:5px; height:10px; }
    .goal-text{ font-size: 16.5px; }
    .goal-del{ font-size: 17px; }
    .empty-state{ font-size: 16px; padding: 16px 0 28px; }
    .add-form{ padding-top: 20px; }
    .add-input{ font-size: 16.5px; padding: 12px 2px; }
    .chip{ font-size: 14px; padding: 7px 15px; }
    .add-submit{ font-size: 16px; padding: 13px; }
    .status-note{ font-size: 13px; margin-top: 28px; }
    .signin{ padding: 60px 20px; }
    .signin-title{ font-size: 34px; }
    .signin-sub{ font-size: 15px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading" id="loading">Loading your week…</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyC1WkzFKMbUjJhTSsDMQCS7hRYcvm4dCyw",
    authDomain: "goals-tracker-3728e.firebaseapp.com",
    projectId: "goals-tracker-3728e",
    storageBucket: "goals-tracker-3728e.firebasestorage.app",
    messagingSenderId: "641924780118",
    appId: "1:641924780118:web:52d94e668eae0b61cf6bf7"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Each signed-in user reads/writes only their own users/{uid}/kv/{key}
  // documents — enforced server-side by the Firestore security rules, not
  // by anything in this file.
  function kv(key){
    return db.collection('users').doc(auth.currentUser.uid).collection('kv').doc(key);
  }
  window.storage = {
    async get(key){
      const doc = await kv(key).get();
      if (!doc.exists) throw new Error('Key not found: ' + key);
      return { key, value: doc.data().value, shared: false };
    },
    async set(key, value){
      await kv(key).set({ value });
      return { key, value, shared: false };
    },
    async delete(key){
      const ref = kv(key);
      const doc = await ref.get();
      const existed = doc.exists;
      await ref.delete();
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const snap = await db.collection('users').doc(auth.currentUser.uid).collection('kv').get();
      const keys = [];
      snap.forEach(d => { if (!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: false };
    }
  };

  const CATEGORY_DEFAULTS = ['Work','Fitness','Personal'];

  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function isoDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtWeekLabel(monday){
    const opts = {month:'short', day:'numeric'};
    const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
    return `${monday.toLocaleDateString('en-US',opts)} – ${sunday.toLocaleDateString('en-US',opts)}`;
  }
  function defaultTab(now){
    const day = now.getDay(); // 0 Sun..6 Sat
    const hour = now.getHours();
    if (day === 5 && hour >= 18) return 'weekend';
    if (day === 6 || day === 0) return 'weekend';
    return 'weekday';
  }

  const DAYS = {
    weekday: ['Mon','Tue','Wed','Thu','Fri'],
    weekend: ['Fri night','Sat','Sun']
  };
  const DAY_OFFSET = {
    'Mon':0, 'Tue':1, 'Wed':2, 'Thu':3, 'Fri':4,
    'Fri night':4, 'Sat':5, 'Sun':6
  };

  function dayDate(monday, day){
    const d = new Date(monday);
    d.setDate(d.getDate() + DAY_OFFSET[day]);
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }

  function defaultDay(now, tab){
    const d = now.getDay(); // 0 Sun..6 Sat
    if (tab === 'weekend'){
      if (d === 6) return 'Sat';
      if (d === 0) return 'Sun';
      return 'Fri night';
    }
    return (d >= 1 && d <= 5) ? DAYS.weekday[d-1] : 'Mon';
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  const state = {
    today: new Date(),
    monday: null,
    activeTab: null,
    week: { weekday: [], weekend: [] },
    prevWeek: null,
    categories: CATEGORY_DEFAULTS.slice(),
    selectedCategory: CATEGORY_DEFAULTS[0],
    selectedDay: { weekday: null, weekend: null },
    movingGoalId: null,
    editingGoalId: null,
    addingCategory: false,
    ready: false
  };
  state.monday = getMonday(state.today);
  state.activeTab = defaultTab(state.today);
  state.selectedDay.weekday = defaultDay(state.today, 'weekday');
  state.selectedDay.weekend = defaultDay(state.today, 'weekend');

  const app = document.getElementById('app');

  async function weekKey(monday){ return 'goals-week:' + isoDate(monday); }

  // Goals saved before days existed have no valid `day`, so they'd filter out
  // of every day view and look deleted. Park them on the tab's first day.
  function withDays(list, tab){
    return (list || []).map(g =>
      DAYS[tab].includes(g.day) ? g : { ...g, day: DAYS[tab][0] }
    );
  }

  async function loadWeek(monday){
    try{
      const res = await window.storage.get(await weekKey(monday), false);
      if (res && res.value){
        const parsed = JSON.parse(res.value);
        return {
          weekday: withDays(parsed.weekday, 'weekday'),
          weekend: withDays(parsed.weekend, 'weekend'),
          copyDismissed: !!parsed.copyDismissed
        };
      }
    }catch(e){ /* no data for this week yet */ }
    return { weekday: [], weekend: [], copyDismissed: false };
  }

  async function saveWeek(){
    try{
      await window.storage.set(await weekKey(state.monday), JSON.stringify(state.week), false);
    }catch(e){ console.error('Storage error saving week', e); }
  }

  async function loadCategories(){
    try{
      const res = await window.storage.get('goals-categories', false);
      if (res && res.value){
        const arr = JSON.parse(res.value);
        if (Array.isArray(arr) && arr.length) return arr;
      }
    }catch(e){ /* use defaults */ }
    return CATEGORY_DEFAULTS.slice();
  }

  async function saveCategories(){
    try{
      await window.storage.set('goals-categories', JSON.stringify(state.categories), false);
    }catch(e){ console.error('Storage error saving categories', e); }
  }

  async function init(){
    const [week, categories] = await Promise.all([
      loadWeek(state.monday),
      loadCategories()
    ]);
    state.week = week;
    state.categories = categories;
    state.selectedCategory = categories[0];

    const prevMonday = new Date(state.monday); prevMonday.setDate(prevMonday.getDate()-7);
    if (week.weekday.length === 0 && week.weekend.length === 0 && !week.copyDismissed){
      state.prevWeek = await loadWeek(prevMonday);
      if (state.prevWeek.weekday.length === 0 && state.prevWeek.weekend.length === 0) state.prevWeek = null;
    }

    state.ready = true;
    render();
  }

  async function goToWeek(offsetDays){
    state.monday = new Date(state.monday.getTime());
    state.monday.setDate(state.monday.getDate() + offsetDays);
    state.week = await loadWeek(state.monday);
    state.prevWeek = null;
    if (state.week.weekday.length === 0 && state.week.weekend.length === 0 && !state.week.copyDismissed){
      const prevMonday = new Date(state.monday); prevMonday.setDate(prevMonday.getDate()-7);
      const pw = await loadWeek(prevMonday);
      if (pw.weekday.length > 0 || pw.weekend.length > 0) state.prevWeek = pw;
    }
    render();
  }

  async function dismissCopyBanner(){
    state.week.copyDismissed = true;
    state.prevWeek = null;
    await saveWeek();
    render();
  }

  async function copyPrevWeek(){
    if (!state.prevWeek) return;
    state.week = {
      weekday: state.prevWeek.weekday.map(g => ({ ...g, id: uid(), done: false })),
      weekend: state.prevWeek.weekend.map(g => ({ ...g, id: uid(), done: false })),
      copyDismissed: true
    };
    state.prevWeek = null;
    await saveWeek();
    render();
  }

  async function addGoal(text){
    const trimmed = text.trim();
    if (!trimmed) return;
    state.week[state.activeTab].push({
      id: uid(), text: trimmed, category: state.selectedCategory, done: false,
      day: state.selectedDay[state.activeTab]
    });
    await saveWeek();
    render();
  }

  async function toggleGoal(id){
    const list = state.week[state.activeTab];
    const g = list.find(x => x.id === id);
    if (g){ g.done = !g.done; await saveWeek(); render(); }
  }

  async function saveGoalText(id, text){
    const trimmed = text.trim();
    const g = state.week[state.activeTab].find(x => x.id === id);
    if (g && trimmed) g.text = trimmed;
    state.editingGoalId = null;
    if (g && trimmed) await saveWeek();
    render();
  }

  async function moveGoal(id, targetDay){
    const g = state.week[state.activeTab].find(x => x.id === id);
    if (g) g.day = targetDay;
    state.movingGoalId = null;
    await saveWeek();
    render();
  }

  async function deleteGoal(id){
    state.week[state.activeTab] = state.week[state.activeTab].filter(x => x.id !== id);
    await saveWeek();
    render();
  }

  async function addCategory(name){
    const trimmed = name.trim();
    if (!trimmed) return;
    if (!state.categories.includes(trimmed)) state.categories.push(trimmed);
    state.selectedCategory = trimmed;
    state.addingCategory = false;
    await saveCategories();
    render();
  }

  function groupByCategory(list){
    const groups = {};
    const order = [];
    list.forEach(g => {
      if (!groups[g.category]){ groups[g.category] = []; order.push(g.category); }
      groups[g.category].push(g);
    });
    return order.map(cat => ({ category: cat, goals: groups[cat] }));
  }

  function render(){
    if (!state.ready){
      app.innerHTML = '<div class="loading">Loading your week…</div>';
      return;
    }
    const isWeekday = state.activeTab === 'weekday';
    const activeDay = state.selectedDay[state.activeTab];
    const list = state.week[state.activeTab].filter(g => g.day === activeDay);
    const done = list.filter(g => g.done).length;
    const total = list.length;
    const pct = total ? Math.round((done/total)*100) : 0;

    const wdDone = state.week.weekday.filter(g=>g.done).length, wdTotal = state.week.weekday.length;
    const weDone = state.week.weekend.filter(g=>g.done).length, weTotal = state.week.weekend.length;

    let html = '';
    html += `<div class="header">
      <button class="nav-btn" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="week-label">${fmtWeekLabel(state.monday)}</div>
      <button class="nav-btn" id="nextWeek" aria-label="Next week">›</button>
    </div>`;
    html += `<div class="tabs">
      <button class="tab ${isWeekday?'active':''}" data-tab="weekday">
        <span class="t-name">Weekday</span>
        <span class="t-count">${wdDone}/${wdTotal} done</span>
      </button>
      <button class="tab ${!isWeekday?'active':''}" data-tab="weekend">
        <span class="t-name">Weekend</span>
        <span class="t-count">${weDone}/${weTotal} done</span>
      </button>
    </div>`;

    html += `<div class="day-row">`;
    DAYS[state.activeTab].forEach(day => {
      const dayGoals = state.week[state.activeTab].filter(g => g.day === day);
      const dDone = dayGoals.filter(g => g.done).length;
      const allDone = dayGoals.length > 0 && dDone === dayGoals.length;
      html += `<button class="day-btn ${day===activeDay?'active '+state.activeTab:''}" data-day="${escapeHtml(day)}">
        <span class="d-name">${escapeHtml(day)}</span>
        <span class="d-date">${dayDate(state.monday, day)}</span>
        <span class="d-count ${allDone?'all-done':''}">${dayGoals.length ? dDone+'/'+dayGoals.length : '—'}</span>
      </button>`;
    });
    html += `</div>`;

    html += `<div class="progress-row">
      <div class="progress-track"><div class="progress-fill ${state.activeTab}" style="width:${pct}%"></div></div>
      <span class="progress-pct ${total && done===total ? 'all-done':''}">${total ? pct+'%' : '—'}</span>
    </div>`;

    if (state.prevWeek){
      html += `<div class="copy-banner">
        <span class="copy-text">Bring over last week's goals?</span>
        <button id="copyPrev">Copy them in</button>
        <button class="copy-dismiss" id="dismissCopy" aria-label="Dismiss">✕</button>
      </div>`;
    }

    if (total === 0){
      html += `<div class="empty-state">Nothing set for ${escapeHtml(activeDay)} yet — add what you want to get done.</div>`;
    } else {
      const groups = groupByCategory(list);
      groups.forEach(group => {
        html += `<div class="category-group">
          <div class="category-name">${escapeHtml(group.category)}</div>
          <div class="goal-list" data-category="${escapeHtml(group.category)}">`;
        group.goals.forEach(g => {
          html += `<div class="goal-item" data-id="${g.id}">
            <div class="goal-row">
              <button class="goal-check ${g.done?'checked':''}" data-id="${g.id}" aria-label="${g.done?'Mark not done':'Mark done'}"></button>
              ${state.editingGoalId===g.id
                ? `<input class="goal-edit-input" id="editInput" type="text" maxlength="140" value="${escapeHtml(g.text)}" data-id="${g.id}" />`
                : `<span class="goal-text ${g.done?'done':''}" data-id="${g.id}" title="Click to edit">${escapeHtml(g.text)}</span>`}
              <button class="goal-move ${state.movingGoalId===g.id?'open':''}" data-id="${g.id}" aria-label="Move to another day">⇄</button>
              <button class="goal-del" data-id="${g.id}" aria-label="Delete goal">✕</button>
            </div>`;
          if (state.movingGoalId === g.id){
            html += `<div class="move-row"><span class="move-label">Move to</span>`;
            DAYS[state.activeTab].forEach(d => {
              html += `<button class="move-day" data-id="${g.id}" data-target="${escapeHtml(d)}" ${d===g.day?'disabled':''}>${escapeHtml(d)}</button>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
        html += `</div></div>`;
      });
    }

    html += `<div class="add-form">
      <input class="add-input" id="goalInput" type="text" placeholder="What do you want to get done?" maxlength="140" />
      <div class="chip-row" id="chipRow"></div>
      <button class="add-submit ${state.activeTab}" id="addBtn">Add to ${escapeHtml(activeDay)}</button>
    </div>`;

    html += `<div class="status-note">Synced to your Google account. <button class="signout-link" id="signOutBtn">Sign out</button></div>`;

    app.innerHTML = html;
    renderChips();
    attachHandlers();
    initSortable();
  }

  let sortables = [];

  // Rebuilds the tab's array from the DOM after a drag: the dragged goal takes
  // the category of whatever list it landed in, and the visible day's goals are
  // re-appended in their new on-screen order. Goals on other days are untouched.
  async function applyDragOrder(){
    const tab = state.activeTab;
    const activeDay = state.selectedDay[tab];
    const byId = new Map(state.week[tab].map(g => [g.id, g]));
    const reordered = [];
    document.querySelectorAll('.goal-list').forEach(listEl => {
      const category = listEl.getAttribute('data-category');
      listEl.querySelectorAll('.goal-item').forEach(item => {
        const g = byId.get(item.getAttribute('data-id'));
        if (g){ g.category = category; reordered.push(g); }
      });
    });
    state.week[tab] = [...state.week[tab].filter(g => g.day !== activeDay), ...reordered];
    await saveWeek();
    render();
  }

  function initSortable(){
    sortables.forEach(s => s.destroy());
    sortables = [];
    if (!window.Sortable) return; // CDN unavailable — app still works, just no dragging
    document.querySelectorAll('.goal-list').forEach(el => {
      sortables.push(new Sortable(el, {
        group: 'goals',
        draggable: '.goal-item',
        animation: 150,
        // Touch has no HTML5 drag-and-drop, so it uses the fallback regardless;
        // forcing it on desktop too keeps the drag identical on both.
        forceFallback: true,
        fallbackTolerance: 4,
        // Touch needs a long-press, otherwise a drag would hijack page scrolling.
        delay: 200,
        delayOnTouchOnly: true,
        filter: '.goal-check, .goal-del, .goal-move, .move-row, .goal-edit-input',
        preventOnFilter: false,
        onEnd: applyDragOrder
      }));
    });
  }

  function renderChips(){
    const chipRow = document.getElementById('chipRow');
    let html = '';
    state.categories.forEach(cat => {
      const sel = cat === state.selectedCategory && !state.addingCategory;
      html += `<button class="chip ${sel?'selected '+state.activeTab:''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
    });
    if (state.addingCategory){
      html += `<input class="chip-new-input" id="newCatInput" type="text" placeholder="Category name" maxlength="24" autofocus />`;
    } else {
      html += `<button class="chip" id="newCatChip">+ New</button>`;
    }
    chipRow.innerHTML = html;

    chipRow.querySelectorAll('.chip[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.selectedCategory = btn.getAttribute('data-cat');
        state.addingCategory = false;
        render();
      });
    });
    const newChip = document.getElementById('newCatChip');
    if (newChip) newChip.addEventListener('click', () => {
      state.addingCategory = true;
      render();
      setTimeout(() => document.getElementById('newCatInput').focus(), 0);
    });
    const newInput = document.getElementById('newCatInput');
    if (newInput){
      newInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ addCategory(newInput.value); }
        if (e.key === 'Escape'){ state.addingCategory = false; render(); }
      });
      newInput.addEventListener('blur', () => {
        if (newInput.value.trim()) addCategory(newInput.value);
        else { state.addingCategory = false; render(); }
      });
    }
  }

  function attachHandlers(){
    document.getElementById('prevWeek').addEventListener('click', () => goToWeek(-7));
    document.getElementById('nextWeek').addEventListener('click', () => goToWeek(7));
    document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        state.activeTab = t.getAttribute('data-tab');
        state.selectedCategory = state.categories[0];
        state.movingGoalId = null;
        render();
      });
    });

    document.querySelectorAll('.day-btn').forEach(b => {
      b.addEventListener('click', () => {
        state.selectedDay[state.activeTab] = b.getAttribute('data-day');
        state.movingGoalId = null;
        render();
      });
    });

    const copyBtn = document.getElementById('copyPrev');
    if (copyBtn) copyBtn.addEventListener('click', copyPrevWeek);
    const dismissBtn = document.getElementById('dismissCopy');
    if (dismissBtn) dismissBtn.addEventListener('click', dismissCopyBanner);

    document.querySelectorAll('.goal-move').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-id');
        state.movingGoalId = state.movingGoalId === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('.move-day').forEach(el => {
      el.addEventListener('click', () => moveGoal(el.getAttribute('data-id'), el.getAttribute('data-target')));
    });

    document.querySelectorAll('.goal-check').forEach(el => {
      el.addEventListener('click', () => toggleGoal(el.getAttribute('data-id')));
    });
    document.querySelectorAll('.goal-text').forEach(el => {
      el.addEventListener('click', () => {
        state.editingGoalId = el.getAttribute('data-id');
        render();
        const inp = document.getElementById('editInput');
        if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    });

    const editInput = document.getElementById('editInput');
    if (editInput){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; saveGoalText(editInput.getAttribute('data-id'), editInput.value); } };
      editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ settled = true; state.editingGoalId = null; render(); }
      });
      editInput.addEventListener('blur', commit);
    }
    document.querySelectorAll('.goal-del').forEach(el => {
      el.addEventListener('click', () => deleteGoal(el.getAttribute('data-id')));
    });

    const input = document.getElementById('goalInput');
    const addBtn = document.getElementById('addBtn');
    addBtn.addEventListener('click', () => {
      addGoal(input.value);
      input.value = '';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ addGoal(input.value); input.value=''; }
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function showSignIn(){
    app.innerHTML = `<div class="signin">
      <div class="signin-title">Weekly Goals</div>
      <div class="signin-sub">Sign in to save your goals and sync them across devices.</div>
      <button id="googleSignIn" class="signin-btn">Sign in with Google</button>
    </div>`;
    document.getElementById('googleSignIn').addEventListener('click', () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => alert('Sign-in failed: ' + e.message));
    });
  }

  auth.onAuthStateChanged((user) => {
    if (user) init();
    else showSignIn();
  });
})();
</script>
</body>
</html>
