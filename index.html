<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goals Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234B7355'/%3E%3Cpath d='M9 16.5l4.8 4.8L23 10.5' fill='none' stroke='%23F4F2EB' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234B7355'/%3E%3Cpath d='M9 16.5l4.8 4.8L23 10.5' fill='none' stroke='%23F4F2EB' stroke-width='3.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#E8E4DA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #E8E4DA;
    --surface: #F4F2EB;
    --ink: #23241F;
    --ink-soft: #6B6858;
    --line: #CFC8B6;
    --weekday: #33517A;
    --weekday-soft: #DCE3EC;
    --weekend: #B5622A;
    --weekend-soft: #F0E0D2;
    --done: #4B7355;
  }
  *{ box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Libre Franklin', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }
  .header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 20px;
  }
  .nav-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 20px;
    line-height: 1;
    padding: 6px 8px;
    cursor:pointer;
    border-radius: 4px;
  }
  .nav-btn:hover{ color: var(--ink); }
  .nav-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .week-label{
    font-family: 'Fraunces', serif;
    font-size: 27px;
    font-weight: 500;
    font-optical-sizing: auto;
    text-align:center;
    flex: 1;
  }
  .tabs{
    display:flex;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }
  .tab{
    flex:1;
    background:none;
    border:none;
    padding: 10px 4px 12px;
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
    text-align:center;
    color: var(--ink-soft);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  .tab .t-name{ font-size:15px; font-weight:600; display:block; }
  .tab .t-count{ font-size:12px; margin-top:2px; display:block; }
  .tab.active{ color: var(--ink); }
  .tab[data-tab="weekday"].active{ border-color: var(--weekday); }
  .tab[data-tab="weekend"].active{ border-color: var(--weekend); }
  .tab:focus-visible{ outline: 2px solid var(--ink); outline-offset: -2px; }

  .weekly{
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 4px;
    margin-bottom: 18px;
  }
  .weekly-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom: 2px;
  }
  .weekly-title{ font-size: 13px; font-weight: 600; color: var(--ink); }
  .weekly-count{ font-size: 12px; color: var(--ink-soft); }
  .weekly-count.all-done{ color: var(--done); font-weight: 600; }
  .weekly-row:last-of-type{ border-bottom: none; }
  .layout{ max-width: 480px; margin: 0 auto; }
  .sub-group{ margin-top: 10px; }
  .sub-group .category-name{ margin-bottom: 0; }
  .mini-chips{
    display: none;
    flex-wrap: wrap;
    gap: 6px;
    padding: 0 0 12px;
  }
  .mini-add:focus-within .mini-chips,
  .mini-add.has-text .mini-chips{ display: flex; }
  .mini-chip{
    border: 1px solid var(--line);
    background: none;
    border-radius: 14px;
    padding: 4px 11px;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .mini-chip:hover{ border-color: var(--ink-soft); color: var(--ink); }
  .mini-chip.selected{ border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .ov-item{ border-bottom: 1px solid var(--line); }
  .ov-item:last-child{ border-bottom: none; }
  .ov-item .goal-row{ border-bottom: none; padding-bottom: 2px; }
  .ov-note-wrap{ padding: 0 24px 10px 28px; }
  .ov-note{
    margin: 0;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink-soft);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    cursor: pointer;
  }
  .ov-note.done{ opacity: .7; }
  .ov-note-add{
    background:none;
    border:none;
    padding: 0;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    opacity: .75;
  }
  .ov-note-add:hover{ opacity: 1; color: var(--ink); }
  .ov-note-input{
    width: 100%;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    line-height: 1.45;
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1.5px solid var(--ink-soft);
    padding: 0 0 2px;
    resize: none;
    overflow: hidden;
    display: block;
  }
  .ov-note-input:focus{ outline: none; border-bottom-color: var(--ink); }
  .ov-list .sortable-chosen{ background: var(--bg); border-radius: 6px; }
  @media (min-width: 768px){
    .ov-note-wrap{ padding-left: 32px; }
    .ov-note, .ov-note-input{ font-size: 13.5px; }
  }
  .overall{
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px 4px;
    margin: 16px 18px 0;
  }
  .weekly-add{
    width:100%;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 14px;
    padding: 10px 0;
    border:none;
    background:none;
    color: var(--ink);
  }
  .weekly-add:focus{ outline:none; }
  .weekly-add::placeholder{ color: var(--ink-soft); }

  .day-row{
    display:flex;
    gap: 6px;
    margin-bottom: 18px;
  }
  .day-btn{
    flex:1;
    min-width: 0;
    background:none;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 7px 2px;
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
    color: var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 2px;
    white-space:nowrap;
  }
  .day-btn .d-name{ font-size: 12.5px; font-weight:600; }
  .day-btn .d-date{ font-size: 10px; opacity: .8; }
  .day-btn .d-count{ font-size: 10.5px; }
  .day-btn .d-count.all-done{ color: var(--done); }
  .day-btn.active.weekday{ background: var(--weekday-soft); border-color: var(--weekday); color: var(--weekday); }
  .day-btn.active.weekend{ background: var(--weekend-soft); border-color: var(--weekend); color: var(--weekend); }
  .day-btn:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }

  .progress-row{
    display:flex;
    align-items:center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .progress-track{
    flex:1;
    height: 3px;
    background: var(--line);
    border-radius: 2px;
    overflow:hidden;
  }
  .progress-pct{
    font-size: 11.5px;
    color: var(--ink-soft);
    min-width: 30px;
    text-align:right;
    font-variant-numeric: tabular-nums;
  }
  .progress-pct.all-done{ color: var(--done); font-weight:600; }
  .progress-fill{
    height:100%;
    width:0%;
    transition: width .35s ease;
  }
  .progress-fill.weekday{ background: var(--weekday); }
  .progress-fill.weekend{ background: var(--weekend); }

  .copy-banner{
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap: 10px;
  }
  .copy-banner .copy-text{ flex:1; }
  .copy-banner button#copyPrev{
    background: var(--ink);
    color: var(--surface);
    border:none;
    border-radius: 4px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    font-family: 'Libre Franklin', sans-serif;
  }
  .copy-dismiss{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 14px;
    line-height:1;
    padding: 4px 2px;
    cursor:pointer;
  }
  .copy-dismiss:hover{ color: var(--ink); }

  .category-group{ margin-bottom: 18px; }
  .category-name{
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .cat-head{
    display: block;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Libre Franklin', sans-serif;
    text-align: left;
    cursor: pointer;
  }
  .cat-head:hover{ color: var(--ink); }
  .cat-head:focus-visible{ outline: 2px solid var(--ink); outline-offset: 2px; }
  .cat-edit{
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .cat-edit-input{
    flex: 1;
    min-width: 0;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    font-weight: 600;
    color: var(--ink);
    background: none;
    border: none;
    border-bottom: 1.5px solid var(--ink);
    padding: 2px 0;
  }
  .cat-edit-input:focus{ outline: none; }
  .cat-del{
    background: none;
    border: 1px solid var(--weekend);
    color: var(--weekend);
    border-radius: 12px;
    padding: 3px 10px;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }
  .cat-del:hover{ background: var(--weekend-soft); }
  .goal-row{
    display:flex;
    align-items:flex-start;
    gap: 10px;
    padding: 9px 0;
    border-bottom: 1px solid var(--line);
  }
  .goal-check{
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink-soft);
    border-radius: 3px;
    flex-shrink:0;
    margin-top: 2px;
    cursor:pointer;
    background: none;
    padding:0;
    position:relative;
  }
  /* Visual box stays 18px, but the tap target extends into the surrounding
     padding — 18px alone is too small to hit reliably on a phone. */
  .goal-check::before{
    content:"";
    position:absolute;
    top:-11px; bottom:-11px; left:-10px; right:-6px;
  }
  .goal-check.checked{ background: var(--done); border-color: var(--done); }
  .goal-check.checked::after{
    content:"";
    position:absolute;
    left:4px; top:1px;
    width:5px; height:9px;
    border: solid var(--surface);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .goal-text{
    flex:1;
    font-size: 15px;
    line-height:1.4;
    cursor:pointer;
  }
  .goal-edit-input{
    flex:1;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 15px;
    line-height:1.4;
    padding: 0;
    border:none;
    border-bottom: 1.5px solid var(--ink-soft);
    background:none;
    color: var(--ink);
    min-width: 0;
  }
  .goal-edit-input:focus{ outline:none; border-bottom-color: var(--ink); }
  .goal-list{ min-height: 4px; }
  .sortable-ghost{ opacity: .35; }
  .sortable-chosen .goal-row{ background: var(--bg); border-radius: 4px; }
  .goal-text.done{
    color: var(--ink-soft);
    text-decoration: line-through;
    text-decoration-color: var(--ink-soft);
  }
  .goal-del, .goal-move{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-size: 15px;
    cursor:pointer;
    padding: 2px 6px;
    line-height:1;
  }
  .goal-del:hover, .goal-move:hover{ color: var(--ink); }
  .goal-move.open{ color: var(--ink); }

  .move-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap: 6px;
    padding: 8px 0 10px 28px;
  }
  .move-label{ font-size: 12px; color: var(--ink-soft); }
  .move-day{
    border: 1px solid var(--line);
    background:none;
    border-radius: 14px;
    padding: 4px 11px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .move-day:hover:not(:disabled){ border-color: var(--ink-soft); color: var(--ink); }
  .move-day:disabled{ opacity: .35; cursor:default; }
  .repeat-day.on, .repeat-pick.on{ border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .repeat-day.on:disabled, .repeat-pick.on:disabled{ opacity: .6; }
  .repeat-stop{ border-style: dashed; }
  .move-row + .move-row{ padding-top: 0; }
  .goal-move.repeat{ color: var(--ink); }
  /* ↻ draws noticeably smaller than ✕ at the same font size. */
  .goal-move{ font-size: 19px; }

  .empty-state{
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height:1.5;
    padding: 10px 0 24px;
  }

  .add-form{
    margin-top: 10px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .add-input{
    width:100%;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 15px;
    padding: 10px 2px;
    border: none;
    border-bottom: 1.5px solid var(--line);
    background: none;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .add-input:focus{
    outline:none;
    border-bottom-color: var(--ink);
  }
  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .chip{
    border: 1.5px solid var(--line);
    background: none;
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor:pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .chip.selected.weekday{ background: var(--weekday-soft); border-color: var(--weekday); color: var(--weekday); }
  .chip.selected.weekend{ background: var(--weekend-soft); border-color: var(--weekend); color: var(--weekend); }
  .chip-new-input{
    border: 1.5px solid var(--ink-soft);
    border-radius: 20px;
    padding: 6px 13px;
    font-size: 13px;
    font-family: 'Libre Franklin', sans-serif;
    background:none;
    color: var(--ink);
    width: 110px;
  }
  .chip-new-input:focus{ outline:none; }
  .chip-edit{
    display: inline-flex;
    align-items: center;
    gap: 2px;
    border: 1.5px solid var(--ink);
    border-radius: 20px;
    padding: 0 4px 0 13px;
  }
  .chip-edit-input{
    width: 96px;
    border: none;
    background: none;
    padding: 6px 0;
    font-family: 'Libre Franklin', sans-serif;
    font-size: 13px;
    color: var(--ink);
  }
  .chip-edit-input:focus{ outline: none; }
  .chip-del{
    background: none;
    border: none;
    color: var(--weekend);
    font-size: 14px;
    line-height: 1;
    padding: 7px 9px;
    margin: -3px -2px -3px 0;
    border-radius: 50%;
    cursor: pointer;
  }
  .chip-del:hover{ background: var(--weekend-soft); }
  .add-submit{
    width:100%;
    border:none;
    border-radius: 6px;
    padding: 11px;
    font-size: 14.5px;
    font-weight: 600;
    cursor:pointer;
    color: var(--surface);
    font-family: 'Libre Franklin', sans-serif;
  }
  .add-submit.weekday{ background: var(--weekday); }
  .add-submit.weekend{ background: var(--weekend); }
  .add-submit:disabled{ background: var(--line); cursor:default; }

  .loading{
    text-align:center;
    color: var(--ink-soft);
    padding: 60px 0;
    font-size: 14px;
  }
  .signin{
    text-align:center;
    padding: 100px 20px;
  }
  .signin-title{
    font-family: 'Fraunces', serif;
    font-size: 28px;
    margin-bottom: 8px;
  }
  .signin-sub{
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 24px;
  }
  .signin-btn{
    background: var(--ink);
    color: var(--surface);
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Libre Franklin', sans-serif;
  }
  .signout-link{
    background:none;
    border:none;
    color: var(--ink-soft);
    text-decoration: underline;
    font-size: 12px;
    cursor: pointer;
    padding: 0;
    margin-left: 4px;
    font-family: 'Libre Franklin', sans-serif;
  }
  .status-note{
    text-align:center;
    color: var(--ink-soft);
    font-size: 12px;
    margin-top: 24px;
  }

  /* Phone-sized column reads as stranded text on a monitor: on wider screens
     it becomes a centered card and everything scales up to match. */
  @media (min-width: 768px){
    body{
      display:flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .layout{
      width: 100%;
      max-width: 620px;
      margin: auto;
      display:flex;
      flex-direction: column;
      gap: 20px;
    }
    .app, .overall{
      width: 100%;
      max-width: none;
      margin: 0;
      background: var(--surface);
      border: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(35,36,31,.05), 0 12px 32px rgba(35,36,31,.07);
    }
    .app{ border-radius: 16px; padding: 36px 40px 40px; }
    .overall{ border-radius: 14px; padding: 20px 24px 8px; }
    .nav-btn{ font-size: 22px; }
    .week-label{ font-size: 34px; }
    .header{ margin-bottom: 26px; }
    .tabs{ margin-bottom: 24px; }
    .tab{ padding: 12px 4px 14px; }
    .tab .t-name{ font-size: 17px; }
    .tab .t-count{ font-size: 13px; }
    .weekly{ padding: 14px 18px 4px; margin-bottom: 22px; }
    .weekly-title{ font-size: 14px; }
    .weekly-count{ font-size: 13px; }
    .weekly-add{ font-size: 15px; }
    .day-row{ gap: 8px; margin-bottom: 22px; }
    .day-btn{ padding: 9px 4px; border-radius: 10px; }
    .day-btn .d-name{ font-size: 13.5px; }
    .day-btn .d-date{ font-size: 11px; }
    .day-btn .d-count{ font-size: 11.5px; }
    .progress-row{ margin-bottom: 28px; }
    .progress-track{ height: 4px; }
    .progress-pct{ font-size: 12.5px; min-width: 34px; }
    .copy-banner{ background: var(--bg); font-size: 14.5px; padding: 14px 16px; }
    .category-name{ font-size: 14px; }
    .goal-row{ padding: 12px 0; gap: 12px; }
    .goal-check{ width: 20px; height: 20px; }
    .goal-check.checked::after{ left:5px; top:2px; width:5px; height:10px; }
    .goal-text{ font-size: 16.5px; }
    .goal-del{ font-size: 17px; }
    .empty-state{ font-size: 16px; padding: 16px 0 28px; }
    .add-form{ padding-top: 20px; }
    .add-input{ font-size: 16.5px; padding: 12px 2px; }
    .chip{ font-size: 14px; padding: 7px 15px; }
    .add-submit{ font-size: 16px; padding: 13px; }
    .status-note{ font-size: 13px; margin-top: 28px; }
    .signin{ padding: 60px 20px; }
    .signin-title{ font-size: 34px; }
    .signin-sub{ font-size: 15px; }
  }

  /* Room beside the card: overall goals go in a right-hand column and stay
     pinned while the week scrolls. */
  @media (min-width: 980px){
    .layout{
      max-width: none;
      display:grid;
      grid-template-columns: minmax(0, 620px) 320px;
      justify-content: center;
      column-gap: 24px;
      align-items: start;
    }
    .app{ grid-column: 1; grid-row: 1; }
    .overall{
      grid-column: 2;
      grid-row: 1;
      position: sticky;
      top: 40px;
    }
  }
  /* Wide enough to keep the card itself centered with the column beside it. */
  @media (min-width: 1300px){
    .layout{
      grid-template-columns: 1fr minmax(0, 620px) 1fr;
      column-gap: 32px;
    }
    .app{ grid-column: 2; }
    .overall{ grid-column: 3; max-width: 360px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside class="overall" id="overall" hidden></aside>
  <div class="app" id="app">
    <div class="loading" id="loading">Loading your week…</div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyC1WkzFKMbUjJhTSsDMQCS7hRYcvm4dCyw",
    authDomain: "goals-tracker-3728e.firebaseapp.com",
    projectId: "goals-tracker-3728e",
    storageBucket: "goals-tracker-3728e.firebasestorage.app",
    messagingSenderId: "641924780118",
    appId: "1:641924780118:web:52d94e668eae0b61cf6bf7"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  // Each signed-in user reads/writes only their own users/{uid}/kv/{key}
  // documents — enforced server-side by the Firestore security rules, not
  // by anything in this file.
  function kv(key){
    return db.collection('users').doc(auth.currentUser.uid).collection('kv').doc(key);
  }
  window.storage = {
    async get(key){
      const doc = await kv(key).get();
      if (!doc.exists) throw new Error('Key not found: ' + key);
      return { key, value: doc.data().value, shared: false };
    },
    async set(key, value){
      await kv(key).set({ value });
      return { key, value, shared: false };
    },
    async delete(key){
      const ref = kv(key);
      const doc = await ref.get();
      const existed = doc.exists;
      await ref.delete();
      return { key, deleted: existed, shared: false };
    },
    async list(prefix){
      const snap = await db.collection('users').doc(auth.currentUser.uid).collection('kv').get();
      const keys = [];
      snap.forEach(d => { if (!prefix || d.id.startsWith(prefix)) keys.push(d.id); });
      return { keys, prefix, shared: false };
    }
  };

  const CATEGORY_DEFAULTS = ['Work','Fitness','Personal'];

  function getMonday(d){
    const date = new Date(d);
    const day = date.getDay();
    const diff = (day === 0 ? -6 : 1 - day);
    date.setDate(date.getDate() + diff);
    date.setHours(0,0,0,0);
    return date;
  }
  function isoDate(d){
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }
  function fmtWeekLabel(monday){
    const opts = {month:'short', day:'numeric'};
    const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
    return `${monday.toLocaleDateString('en-US',opts)} – ${sunday.toLocaleDateString('en-US',opts)}`;
  }
  function defaultTab(now){
    const day = now.getDay(); // 0 Sun..6 Sat
    const hour = now.getHours();
    if (day === 5 && hour >= 18) return 'weekend';
    if (day === 6 || day === 0) return 'weekend';
    return 'weekday';
  }

  const DAYS = {
    weekday: ['Mon','Tue','Wed','Thu','Fri'],
    weekend: ['Fri night','Sat','Sun']
  };
  const DAY_OFFSET = {
    'Mon':0, 'Tue':1, 'Wed':2, 'Thu':3, 'Fri':4,
    'Fri night':4, 'Sat':5, 'Sun':6
  };

  function dayDate(monday, day){
    const d = new Date(monday);
    d.setDate(d.getDate() + DAY_OFFSET[day]);
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
  }

  function defaultDay(now, tab){
    const d = now.getDay(); // 0 Sun..6 Sat
    if (tab === 'weekend'){
      if (d === 6) return 'Sat';
      if (d === 0) return 'Sun';
      return 'Fri night';
    }
    return (d >= 1 && d <= 5) ? DAYS.weekday[d-1] : 'Mon';
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  const state = {
    today: new Date(),
    monday: null,
    activeTab: null,
    week: { weekday: [], weekend: [] },
    prevWeek: null,
    categories: CATEGORY_DEFAULTS.slice(),
    selectedCategory: CATEGORY_DEFAULTS[0],
    selectedDay: { weekday: null, weekend: null },
    movingGoalId: null,
    editingGoalId: null,
    editingWeeklyId: null,
    overall: [],
    editingOverallId: null,
    editingNoteId: null,
    editingChip: null,
    routines: [],
    dayOrder: {},
    weeklyCategory: null,
    overallCategory: null,
    addingCategory: false,
    ready: false
  };
  state.monday = getMonday(state.today);
  state.activeTab = defaultTab(state.today);
  state.selectedDay.weekday = defaultDay(state.today, 'weekday');
  state.selectedDay.weekend = defaultDay(state.today, 'weekend');

  const app = document.getElementById('app');
  const overallEl = document.getElementById('overall');

  async function weekKey(monday){ return 'goals-week:' + isoDate(monday); }

  // Goals saved before days existed have no valid `day`, so they'd filter out
  // of every day view and look deleted. Park them on the tab's first day.
  function withDays(list, tab){
    return (list || []).map(g =>
      DAYS[tab].includes(g.day) ? g : { ...g, day: DAYS[tab][0] }
    );
  }

  async function loadWeek(monday){
    try{
      const res = await window.storage.get(await weekKey(monday), false);
      if (res && res.value){
        const parsed = JSON.parse(res.value);
        return {
          weekday: withDays(parsed.weekday, 'weekday'),
          weekend: withDays(parsed.weekend, 'weekend'),
          weekly: parsed.weekly || [],
          routineDone: parsed.routineDone || [],
          copyDismissed: !!parsed.copyDismissed
        };
      }
    }catch(e){ /* no data for this week yet */ }
    return { weekday: [], weekend: [], weekly: [], routineDone: [], copyDismissed: false };
  }

  function isEmptyWeek(w){
    return w.weekday.length === 0 && w.weekend.length === 0 && w.weekly.length === 0;
  }

  async function saveWeek(){
    try{
      await window.storage.set(await weekKey(state.monday), JSON.stringify(state.week), false);
    }catch(e){ console.error('Storage error saving week', e); }
  }

  async function loadCategories(){
    try{
      const res = await window.storage.get('goals-categories', false);
      if (res && res.value){
        const arr = JSON.parse(res.value);
        if (Array.isArray(arr) && arr.length) return arr;
      }
    }catch(e){ /* use defaults */ }
    return CATEGORY_DEFAULTS.slice();
  }

  async function saveCategories(){
    try{
      await window.storage.set('goals-categories', JSON.stringify(state.categories), false);
    }catch(e){ console.error('Storage error saving categories', e); }
  }

  // Sorts the existing categories into the requested order once; after that,
  // the order set by dragging the category chips is left alone.
  const PREFERRED_ORDER = ['work', 'fitness', 'personal', 'todo', 'needs'];
  async function applyPreferredOrderOnce(){
    let prefs = {};
    try{
      const res = await window.storage.get('goals-prefs', false);
      prefs = JSON.parse(res.value) || {};
    }catch(e){ /* first run */ }
    if (prefs.categoryOrderV1) return;
    const norm = s => s.toLowerCase().replace(/[^a-z]/g, '');
    const rank = c => {
      const i = PREFERRED_ORDER.indexOf(norm(c));
      return i < 0 ? PREFERRED_ORDER.length : i;
    };
    state.categories = state.categories
      .map((c, i) => ({ c, i }))
      .sort((a, b) => rank(a.c) - rank(b.c) || a.i - b.i)
      .map(x => x.c);
    prefs.categoryOrderV1 = true;
    try{
      await Promise.all([saveCategories(), window.storage.set('goals-prefs', JSON.stringify(prefs), false)]);
    }catch(e){ console.error('Storage error saving preferences', e); }
  }

  async function loadOverall(){
    try{
      const res = await window.storage.get('goals-overall', false);
      if (res && res.value){
        const arr = JSON.parse(res.value);
        if (Array.isArray(arr)) return arr;
      }
    }catch(e){ /* none yet */ }
    return [];
  }

  async function saveOverall(){
    try{
      await window.storage.set('goals-overall', JSON.stringify(state.overall), false);
    }catch(e){ console.error('Storage error saving overall goals', e); }
  }

  async function addOverall(text){
    const trimmed = capFirst(text.trim());
    if (!trimmed) return;
    state.overall.push({ id: uid(), text: trimmed, done: false, category: pickCategory(state.overallCategory) });
    await saveOverall();
    renderOverall();
    const inp = document.getElementById('overallInput');
    if (inp) inp.focus();
  }

  async function toggleOverall(id){
    const g = state.overall.find(x => x.id === id);
    if (g){ g.done = !g.done; await saveOverall(); renderOverall(); }
  }

  async function saveOverallText(id, text){
    const trimmed = capFirst(text.trim());
    const g = state.overall.find(x => x.id === id);
    if (g && trimmed) g.text = trimmed;
    state.editingOverallId = null;
    if (g && trimmed) await saveOverall();
    renderOverall();
  }

  let overallSortables = [];

  function pickCategory(current){
    return state.categories.includes(current) ? current : state.categories[0];
  }

  // Goals saved before these lists had categories get the first one, so they
  // still land in a group; the change is persisted with the list's next save.
  function fillCategories(list){
    list.forEach(g => { if (!g.category) g.category = state.categories[0]; });
  }

  function miniAddHtml(inputId, placeholder, selected){
    return `<div class="mini-add">
      <input class="weekly-add" id="${inputId}" type="text" maxlength="140" placeholder="${placeholder}" />
      <div class="mini-chips">${state.categories.map(c =>
        `<button type="button" class="mini-chip ${c===selected?'selected':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</button>`
      ).join('')}</div>
    </div>`;
  }

  function wireMiniAdd(input, onPick){
    const wrap = input.closest('.mini-add');
    input.addEventListener('input', () => wrap.classList.toggle('has-text', !!input.value));
    wrap.querySelectorAll('.mini-chip').forEach(btn => {
      // The chips only show while the field has focus; keep it there so they
      // don't disappear between mousedown and click.
      btn.addEventListener('mousedown', e => e.preventDefault());
      btn.addEventListener('click', () => {
        onPick(btn.getAttribute('data-cat'));
        wrap.querySelectorAll('.mini-chip').forEach(b => b.classList.toggle('selected', b === btn));
        input.focus();
      });
    });
  }

  async function saveOverallNote(id, text){
    const g = state.overall.find(x => x.id === id);
    const trimmed = text.trim();
    state.editingNoteId = null;
    if (g && trimmed !== (g.note || '')){
      if (trimmed) g.note = trimmed; else delete g.note;
      await saveOverall();
    }
    renderOverall();
  }

  async function deleteOverall(id){
    state.overall = state.overall.filter(x => x.id !== id);
    await saveOverall();
    renderOverall();
  }

  function renderOverall(){
    const list = state.overall;
    fillCategories(list);
    const oDone = list.filter(g => g.done).length;
    let html = `<div class="weekly-head">
        <span class="weekly-title">Overall goals</span>
        ${list.length ? `<span class="weekly-count ${oDone===list.length?'all-done':''}">${oDone}/${list.length} done</span>` : ''}
      </div>`;
    groupByCategory(list).forEach(group => {
    html += `<div class="sub-group">
      ${categoryHeading(group.category, 'overall')}
      <div class="ov-list" data-category="${escapeHtml(group.category)}">`;
    group.goals.forEach(g => {
      let note;
      if (state.editingNoteId === g.id){
        note = `<textarea class="ov-note-input" id="overallNoteInput" rows="1" maxlength="600" data-oid="${g.id}" placeholder="What does this goal mean, why it matters…">${escapeHtml(g.note || '')}</textarea>`;
      } else if (g.note){
        note = `<p class="ov-note ${g.done?'done':''}" data-oid="${g.id}" title="Click to edit">${escapeHtml(g.note)}</p>`;
      } else {
        note = `<button class="ov-note-add" data-oid="${g.id}">+ Add details</button>`;
      }
      html += `<div class="ov-item" data-oid="${g.id}">
        <div class="goal-row">
          <button class="goal-check ov-check ${g.done?'checked':''}" data-oid="${g.id}" aria-label="${g.done?'Mark not done':'Mark done'}"></button>
          ${state.editingOverallId===g.id
            ? `<input class="goal-edit-input" id="overallEditInput" type="text" maxlength="140" value="${escapeHtml(g.text)}" data-oid="${g.id}" />`
            : `<span class="goal-text ov-text ${g.done?'done':''}" data-oid="${g.id}" title="Click to edit">${escapeHtml(g.text)}</span>`}
          <button class="goal-del ov-del" data-oid="${g.id}" aria-label="Delete overall goal">✕</button>
        </div>
        <div class="ov-note-wrap">${note}</div>
      </div>`;
    });
    html += `</div></div>`;
    });
    html += miniAddHtml('overallInput', 'Add a long-term goal', pickCategory(state.overallCategory));
    overallSortables.forEach(s => s.destroy());
    overallSortables = [];
    overallEl.innerHTML = html;
    overallEl.hidden = false;

    if (window.Sortable){
      overallEl.querySelectorAll('.ov-list').forEach(listEl => {
        overallSortables.push(new Sortable(listEl, {
          group: 'overall',
          draggable: '.ov-item',
          animation: 150,
          forceFallback: true,
          fallbackTolerance: 4,
          delay: 200,
          delayOnTouchOnly: true,
          filter: '.ov-check, .ov-del, .goal-edit-input, .ov-note-input, .ov-note-add',
          preventOnFilter: false,
          onEnd: async () => {
            // Dropping into another category's list moves the goal to that category.
            const byId = new Map(state.overall.map(g => [g.id, g]));
            const reordered = [];
            overallEl.querySelectorAll('.ov-list').forEach(l => {
              const category = l.getAttribute('data-category');
              l.querySelectorAll('.ov-item').forEach(el => {
                const g = byId.get(el.getAttribute('data-oid'));
                if (g){ g.category = category; reordered.push(g); }
              });
            });
            state.overall = reordered;
            await saveOverall();
            renderOverall();
          }
        }));
      });
    }

    const openNote = (id) => {
      state.editingNoteId = id;
      renderOverall();
      const ta = document.getElementById('overallNoteInput');
      if (ta){ ta.style.height = ta.scrollHeight + 'px'; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    };
    overallEl.querySelectorAll('.ov-note-add, .ov-note').forEach(el => {
      el.addEventListener('click', () => openNote(el.getAttribute('data-oid')));
    });
    const noteInput = document.getElementById('overallNoteInput');
    if (noteInput){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; saveOverallNote(noteInput.getAttribute('data-oid'), noteInput.value); } };
      noteInput.addEventListener('input', () => {
        noteInput.style.height = 'auto';
        noteInput.style.height = noteInput.scrollHeight + 'px';
      });
      noteInput.addEventListener('keydown', (e) => {
        // Enter saves like every other field here; Shift+Enter starts a new line.
        if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); commit(); }
        if (e.key === 'Escape'){ settled = true; state.editingNoteId = null; renderOverall(); }
      });
      noteInput.addEventListener('blur', commit);
    }

    overallEl.querySelectorAll('.ov-check').forEach(el => {
      el.addEventListener('click', () => toggleOverall(el.getAttribute('data-oid')));
    });
    overallEl.querySelectorAll('.ov-del').forEach(el => {
      el.addEventListener('click', () => deleteOverall(el.getAttribute('data-oid')));
    });
    overallEl.querySelectorAll('.ov-text').forEach(el => {
      el.addEventListener('click', () => {
        state.editingOverallId = el.getAttribute('data-oid');
        renderOverall();
        const inp = document.getElementById('overallEditInput');
        if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    });
    const edit = document.getElementById('overallEditInput');
    if (edit){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; saveOverallText(edit.getAttribute('data-oid'), edit.value); } };
      edit.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ settled = true; state.editingOverallId = null; renderOverall(); }
      });
      edit.addEventListener('blur', commit);
    }
    const input = document.getElementById('overallInput');
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addOverall(input.value);
    });
    wireMiniAdd(input, cat => { state.overallCategory = cat; });
    wireCategoryHeads(overallEl);
  }

  async function init(){
    const [week, categories, overall, routines, dayOrder] = await Promise.all([
      loadWeek(state.monday),
      loadCategories(),
      loadOverall(),
      loadRoutines(),
      loadDayOrder()
    ]);
    state.routines = routines;
    state.dayOrder = dayOrder;
    state.week = week;
    state.categories = categories;
    await applyPreferredOrderOnce();
    state.overall = overall;
    renderOverall();
    state.selectedCategory = state.categories[0];

    const prevMonday = new Date(state.monday); prevMonday.setDate(prevMonday.getDate()-7);
    if (isEmptyWeek(week) && !week.copyDismissed){
      state.prevWeek = await loadWeek(prevMonday);
      if (isEmptyWeek(state.prevWeek)) state.prevWeek = null;
    }

    state.ready = true;
    render();
  }

  async function goToWeek(offsetDays){
    state.monday = new Date(state.monday.getTime());
    state.monday.setDate(state.monday.getDate() + offsetDays);
    state.week = await loadWeek(state.monday);
    state.prevWeek = null;
    if (isEmptyWeek(state.week) && !state.week.copyDismissed){
      const prevMonday = new Date(state.monday); prevMonday.setDate(prevMonday.getDate()-7);
      const pw = await loadWeek(prevMonday);
      if (!isEmptyWeek(pw)) state.prevWeek = pw;
    }
    render();
  }

  async function dismissCopyBanner(){
    state.week.copyDismissed = true;
    state.prevWeek = null;
    await saveWeek();
    render();
  }

  async function copyPrevWeek(){
    if (!state.prevWeek) return;
    state.week = {
      weekday: state.prevWeek.weekday.map(g => ({ ...g, id: uid(), done: false })),
      weekend: state.prevWeek.weekend.map(g => ({ ...g, id: uid(), done: false })),
      weekly: state.prevWeek.weekly.map(g => ({ ...g, id: uid(), done: false })),
      copyDismissed: true
    };
    state.prevWeek = null;
    await saveWeek();
    render();
  }

  async function addWeekly(text){
    const trimmed = capFirst(text.trim());
    if (!trimmed) return;
    state.week.weekly.push({ id: uid(), text: trimmed, done: false, category: pickCategory(state.weeklyCategory) });
    await saveWeek();
    render();
    const inp = document.getElementById('weeklyInput');
    if (inp) inp.focus();
  }

  async function toggleWeekly(id){
    const g = state.week.weekly.find(x => x.id === id);
    if (g){ g.done = !g.done; await saveWeek(); render(); }
  }

  async function saveWeeklyText(id, text){
    const trimmed = capFirst(text.trim());
    const g = state.week.weekly.find(x => x.id === id);
    if (g && trimmed) g.text = trimmed;
    state.editingWeeklyId = null;
    if (g && trimmed) await saveWeek();
    render();
  }

  async function deleteWeekly(id){
    state.week.weekly = state.week.weekly.filter(x => x.id !== id);
    await saveWeek();
    render();
  }

  function capFirst(s){ return s.charAt(0).toLocaleUpperCase() + s.slice(1); }

  async function addGoal(text){
    const trimmed = capFirst(text.trim());
    if (!trimmed) return;
    state.week[state.activeTab].push({
      id: uid(), text: trimmed, category: state.selectedCategory, done: false,
      day: state.selectedDay[state.activeTab]
    });
    await saveWeek();
    render();
  }

  const ALL_DAYS = [...DAYS.weekday, ...DAYS.weekend];

  async function loadRoutines(){
    try{
      const res = await window.storage.get('goals-routines', false);
      if (res && res.value){
        const arr = JSON.parse(res.value);
        if (Array.isArray(arr)) return arr;
      }
    }catch(e){ /* none yet */ }
    return [];
  }

  async function saveRoutines(){
    try{
      await window.storage.set('goals-routines', JSON.stringify(state.routines), false);
    }catch(e){ console.error('Storage error saving repeating goals', e); }
  }

  async function loadDayOrder(){
    try{
      const res = await window.storage.get('goals-dayorder', false);
      if (res && res.value){
        const obj = JSON.parse(res.value);
        if (obj && typeof obj === 'object') return obj;
      }
    }catch(e){ /* none yet */ }
    return {};
  }

  async function saveDayOrder(){
    try{
      await window.storage.set('goals-dayorder', JSON.stringify(state.dayOrder), false);
    }catch(e){ console.error('Storage error saving day order', e); }
  }

  function routineKey(rid, day){ return rid + '|' + day; }
  function isRoutineId(id){ return id.startsWith('r:'); }
  function routineById(id){ return state.routines.find(r => 'r:' + r.id === id); }

  // A day's goals: repeating goals scheduled on it (from the week each was
  // created onward, so older weeks don't suddenly show them unticked) plus that
  // day's one-off goals. Repeating goals keep their ticks per week in
  // week.routineDone. The order is the last one dragged for that day of the
  // week (dayOrder, keyed by day name so repeating goals keep their spot week
  // to week); anything not in it yet keeps its default place after those.
  function goalsFor(tab, day){
    const wk = isoDate(state.monday);
    const doneSet = new Set(state.week.routineDone || []);
    const repeating = state.routines
      .filter(r => r.days.includes(day) && r.since <= wk)
      .map(r => ({ id: 'r:' + r.id, text: r.text, category: r.category, day,
                   done: doneSet.has(routineKey(r.id, day)), routine: true, days: r.days }));
    const all = [...repeating, ...state.week[tab].filter(g => g.day === day)];
    const order = state.dayOrder[day];
    if (!order) return all;
    const pos = new Map(order.map((id, i) => [id, i]));
    return all
      .map((g, i) => ({ g, key: pos.has(g.id) ? pos.get(g.id) : order.length + i }))
      .sort((a, b) => a.key - b.key)
      .map(x => x.g);
  }

  async function toggleGoal(id){
    if (isRoutineId(id)){
      const r = routineById(id);
      if (!r) return;
      const key = routineKey(r.id, state.selectedDay[state.activeTab]);
      const done = new Set(state.week.routineDone || []);
      if (done.has(key)) done.delete(key); else done.add(key);
      state.week.routineDone = [...done];
      await saveWeek();
      render();
      return;
    }
    const list = state.week[state.activeTab];
    const g = list.find(x => x.id === id);
    if (g){ g.done = !g.done; await saveWeek(); render(); }
  }

  async function saveGoalText(id, text){
    const trimmed = capFirst(text.trim());
    state.editingGoalId = null;
    if (isRoutineId(id)){
      const r = routineById(id);
      if (r && trimmed){ r.text = trimmed; await saveRoutines(); }
      render();
      return;
    }
    const g = state.week[state.activeTab].find(x => x.id === id);
    if (g && trimmed) g.text = trimmed;
    if (g && trimmed) await saveWeek();
    render();
  }

  async function makeRepeating(id, extraDay){
    const tab = state.activeTab;
    const g = state.week[tab].find(x => x.id === id);
    if (!g) return;
    const days = ALL_DAYS.filter(d => d === g.day || d === extraDay);
    const r = { id: uid(), text: g.text, category: g.category, days, since: isoDate(state.monday) };
    state.routines.push(r);
    state.week[tab] = state.week[tab].filter(x => x.id !== id);
    if (g.done) state.week.routineDone = [...(state.week.routineDone || []), routineKey(r.id, g.day)];
    // Keep the panel open on the new repeating goal so its days can be picked straight away.
    state.movingGoalId = 'r:' + r.id;
    await Promise.all([saveRoutines(), saveWeek()]);
    render();
  }

  async function toggleRoutineDay(id, day){
    const r = routineById(id);
    if (!r) return;
    if (r.days.includes(day)){
      if (r.days.length === 1) return;
      r.days = r.days.filter(d => d !== day);
    } else {
      r.days = ALL_DAYS.filter(d => r.days.includes(d) || d === day);
    }
    await saveRoutines();
    render();
  }

  // Turns a repeating goal back into a one-off goal on the day being viewed.
  async function stopRepeating(id){
    const r = routineById(id);
    if (!r) return;
    const tab = state.activeTab, day = state.selectedDay[tab];
    const done = (state.week.routineDone || []).includes(routineKey(r.id, day));
    state.routines = state.routines.filter(x => x !== r);
    state.week[tab].push({ id: uid(), text: r.text, category: r.category, done, day });
    state.movingGoalId = null;
    await Promise.all([saveRoutines(), saveWeek()]);
    render();
  }

  async function moveGoal(id, targetDay){
    const g = state.week[state.activeTab].find(x => x.id === id);
    if (g) g.day = targetDay;
    state.movingGoalId = null;
    await saveWeek();
    render();
  }

  async function deleteGoal(id){
    if (isRoutineId(id)){
      const r = routineById(id);
      if (!r || !confirm(`Delete "${r.text}" from every day it repeats on?`)) return;
      state.routines = state.routines.filter(x => x !== r);
      await saveRoutines();
      render();
      return;
    }
    state.week[state.activeTab] = state.week[state.activeTab].filter(x => x.id !== id);
    await saveWeek();
    render();
  }

  async function addCategory(name){
    const trimmed = capFirst(name.trim());
    if (!trimmed) return;
    if (!state.categories.includes(trimmed)) state.categories.push(trimmed);
    state.selectedCategory = trimmed;
    state.addingCategory = false;
    await saveCategories();
    render();
    renderOverall();
  }

  // Groups follow the category list's order; a category missing from the list
  // (shouldn't happen, but old data could have one) goes last.
  function groupByCategory(list){
    const groups = {};
    const order = [];
    list.forEach(g => {
      if (!groups[g.category]){ groups[g.category] = []; order.push(g.category); }
      groups[g.category].push(g);
    });
    const rank = new Map(order.map((c, i) => {
      const idx = state.categories.indexOf(c);
      return [c, idx < 0 ? state.categories.length + i : idx];
    }));
    order.sort((a, b) => rank.get(a) - rank.get(b));
    return order.map(cat => ({ category: cat, goals: groups[cat] }));
  }

  // Category headings double as the rename/delete control. `where` tells the
  // three lists apart so only the heading that was clicked turns into a field.
  function categoryHeading(cat, where){
    const ed = state.editingCategory;
    if (ed && ed.name === cat && ed.where === where){
      return `<div class="cat-edit">
        <input class="cat-edit-input" id="catEditInput" type="text" maxlength="24" value="${escapeHtml(cat)}" data-cat="${escapeHtml(cat)}" />
        <button type="button" class="cat-del" id="catDeleteBtn" data-cat="${escapeHtml(cat)}" data-where="${where}">Delete</button>
      </div>`;
    }
    return `<button type="button" class="category-name cat-head" data-cat="${escapeHtml(cat)}" data-where="${where}" title="Click to rename or delete">${escapeHtml(cat)}</button>`;
  }

  function rerenderAll(){ render(); renderOverall(); }

  function wireCategoryHeads(root){
    root.querySelectorAll('.cat-head').forEach(el => {
      el.addEventListener('click', () => {
        state.editingCategory = { name: el.getAttribute('data-cat'), where: el.getAttribute('data-where') };
        rerenderAll();
        const inp = document.getElementById('catEditInput');
        if (inp){ inp.focus(); inp.select(); }
      });
    });
    const inp = root.querySelector('#catEditInput');
    if (!inp) return;
    let settled = false;
    const commit = () => { if (!settled){ settled = true; renameCategory(inp.getAttribute('data-cat'), inp.value); } };
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') commit();
      if (e.key === 'Escape'){ settled = true; state.editingCategory = null; rerenderAll(); }
    });
    inp.addEventListener('blur', commit);
    const del = root.querySelector('#catDeleteBtn');
    // Keep focus in the field so its blur (which saves the name) doesn't fire first.
    del.addEventListener('mousedown', e => e.preventDefault());
    del.addEventListener('click', () => { settled = true; clearCategoryIn(del.getAttribute('data-cat'), del.getAttribute('data-where')); });
  }

  // Rewrites a category name on every goal that uses it: the loaded week,
  // overall and repeating goals, and every other saved week.
  async function recategorize(from, to){
    const fix = list => (list || []).forEach(g => { if (g.category === from) g.category = to; });
    fix(state.week.weekday); fix(state.week.weekend); fix(state.week.weekly);
    fix(state.overall); fix(state.routines);
    if (state.prevWeek){ fix(state.prevWeek.weekday); fix(state.prevWeek.weekend); fix(state.prevWeek.weekly); }
    ['selectedCategory', 'weeklyCategory', 'overallCategory'].forEach(k => { if (state[k] === from) state[k] = to; });

    const current = await weekKey(state.monday);
    const { keys } = await window.storage.list('goals-week:');
    await Promise.all(keys.filter(k => k !== current).map(async k => {
      try{
        const res = await window.storage.get(k, false);
        const w = JSON.parse(res.value);
        let changed = false;
        ['weekday', 'weekend', 'weekly'].forEach(t => (w[t] || []).forEach(g => {
          if (g.category === from){ g.category = to; changed = true; }
        }));
        if (changed) await window.storage.set(k, JSON.stringify(w), false);
      }catch(e){ console.error('Could not update category in', k, e); }
    }));
    await Promise.all([saveWeek(), saveOverall(), saveRoutines(), saveCategories()]);
  }

  async function renameCategory(oldName, value){
    const newName = capFirst(value.trim());
    state.editingCategory = null;
    state.editingChip = null;
    if (!newName || newName === oldName){ rerenderAll(); return; }
    if (state.categories.some(c => c !== oldName && c.toLowerCase() === newName.toLowerCase())){
      alert(`There's already a category called "${newName}".`);
      rerenderAll();
      return;
    }
    state.categories = state.categories.map(c => c === oldName ? newName : c);
    if (state.selectedCategory === oldName) state.selectedCategory = newName;
    rerenderAll();
    await recategorize(oldName, newName);
    rerenderAll();
  }

  async function deleteCategory(name){
    state.editingCategory = null;
    state.editingChip = null;
    if (state.categories.length === 1){
      alert("You need at least one category, so this one can't be deleted.");
      rerenderAll();
      return;
    }
    // From the category list: the category leaves the list, and its goals on
    // the viewed day go with it. Goals elsewhere keep the name and still show.
    const day = state.selectedDay[state.activeTab];
    if (!confirm(`Delete the "${name}" category and its goals on ${day}?`)){ rerenderAll(); return; }
    state.categories = state.categories.filter(c => c !== name);
    ['selectedCategory', 'weeklyCategory', 'overallCategory'].forEach(k => {
      if (state[k] === name) state[k] = state.categories[0];
    });
    const routinesChanged = removeDayGoals(name);
    rerenderAll();
    await Promise.all([saveWeek(), saveCategories(), routinesChanged ? saveRoutines() : null]);
  }

  // Deletes a category's goals on the viewed day. A repeating goal in it stops
  // repeating on that weekday, otherwise it would put the group straight back.
  // Returns whether any repeating goal changed.
  function removeDayGoals(name){
    const tab = state.activeTab, day = state.selectedDay[tab];
    state.week[tab] = state.week[tab].filter(g => !(g.day === day && g.category === name));
    let changed = false;
    state.routines = state.routines.flatMap(r => {
      if (r.category !== name || !r.days.includes(day)) return [r];
      changed = true;
      const days = r.days.filter(d => d !== day);
      return days.length ? [{ ...r, days }] : [];
    });
    return changed;
  }

  // From a list's category heading: empties that group in that list only and
  // keeps the category (for the daily list, on the viewed day only).
  async function clearCategoryIn(name, where){
    state.editingCategory = null;
    const day = state.selectedDay[state.activeTab];
    const what = where === 'daily' ? `on ${day}` : where === 'weekly' ? `in this week's goals` : `in your overall goals`;
    if (!confirm(`Delete all the "${name}" goals ${what}?`)){ rerenderAll(); return; }
    if (where === 'weekly'){
      state.week.weekly = state.week.weekly.filter(g => g.category !== name);
      rerenderAll();
      await saveWeek();
      return;
    }
    if (where === 'overall'){
      state.overall = state.overall.filter(g => g.category !== name);
      rerenderAll();
      await saveOverall();
      return;
    }
    const routinesChanged = removeDayGoals(name);
    rerenderAll();
    await Promise.all([saveWeek(), routinesChanged ? saveRoutines() : null]);
  }

  function render(){
    if (!state.ready){
      app.innerHTML = '<div class="loading">Loading your week…</div>';
      return;
    }
    const isWeekday = state.activeTab === 'weekday';
    const activeDay = state.selectedDay[state.activeTab];
    const list = goalsFor(state.activeTab, activeDay);
    const done = list.filter(g => g.done).length;
    const total = list.length;
    const pct = total ? Math.round((done/total)*100) : 0;

    const tabStats = tab => DAYS[tab].reduce((acc, d) => {
      const gs = goalsFor(tab, d);
      acc.done += gs.filter(g => g.done).length;
      acc.total += gs.length;
      return acc;
    }, { done: 0, total: 0 });
    const wd = tabStats('weekday'), we = tabStats('weekend');
    const wdDone = wd.done, wdTotal = wd.total, weDone = we.done, weTotal = we.total;

    let html = '';
    html += `<div class="header">
      <button class="nav-btn" id="prevWeek" aria-label="Previous week">‹</button>
      <div class="week-label">${fmtWeekLabel(state.monday)}</div>
      <button class="nav-btn" id="nextWeek" aria-label="Next week">›</button>
    </div>`;
    const weekly = state.week.weekly;
    fillCategories(weekly);
    const wkDone = weekly.filter(g => g.done).length;
    html += `<section class="weekly">
      <div class="weekly-head">
        <span class="weekly-title">This week goals</span>
        ${weekly.length ? `<span class="weekly-count ${wkDone===weekly.length?'all-done':''}">${wkDone}/${weekly.length} done</span>` : ''}
      </div>`;
    groupByCategory(weekly).forEach(group => {
    html += `<div class="sub-group">
      ${categoryHeading(group.category, 'weekly')}
      <div class="wk-list" data-category="${escapeHtml(group.category)}">`;
    group.goals.forEach(g => {
      html += `<div class="goal-row weekly-row wk-item" data-wid="${g.id}">
        <button class="goal-check wk-check ${g.done?'checked':''}" data-wid="${g.id}" aria-label="${g.done?'Mark not done':'Mark done'}"></button>
        ${state.editingWeeklyId===g.id
          ? `<input class="goal-edit-input" id="weeklyEditInput" type="text" maxlength="140" value="${escapeHtml(g.text)}" data-wid="${g.id}" />`
          : `<span class="goal-text wk-text ${g.done?'done':''}" data-wid="${g.id}" title="Click to edit">${escapeHtml(g.text)}</span>`}
        <button class="goal-del wk-del" data-wid="${g.id}" aria-label="Delete weekly goal">✕</button>
      </div>`;
    });
    html += `</div></div>`;
    });
    html += miniAddHtml('weeklyInput', 'Add a goal for the whole week', pickCategory(state.weeklyCategory));
    html += `</section>`;

    html += `<div class="tabs">
      <button class="tab ${isWeekday?'active':''}" data-tab="weekday">
        <span class="t-name">Weekday</span>
        <span class="t-count">${wdDone}/${wdTotal} done</span>
      </button>
      <button class="tab ${!isWeekday?'active':''}" data-tab="weekend">
        <span class="t-name">Weekend</span>
        <span class="t-count">${weDone}/${weTotal} done</span>
      </button>
    </div>`;

    html += `<div class="day-row">`;
    DAYS[state.activeTab].forEach(day => {
      const dayGoals = goalsFor(state.activeTab, day);
      const dDone = dayGoals.filter(g => g.done).length;
      const allDone = dayGoals.length > 0 && dDone === dayGoals.length;
      html += `<button class="day-btn ${day===activeDay?'active '+state.activeTab:''}" data-day="${escapeHtml(day)}">
        <span class="d-name">${escapeHtml(day)}</span>
        <span class="d-date">${dayDate(state.monday, day)}</span>
        <span class="d-count ${allDone?'all-done':''}">${dayGoals.length ? dDone+'/'+dayGoals.length : '—'}</span>
      </button>`;
    });
    html += `</div>`;

    html += `<div class="progress-row">
      <div class="progress-track"><div class="progress-fill ${state.activeTab}" style="width:${pct}%"></div></div>
      <span class="progress-pct ${total && done===total ? 'all-done':''}">${total ? pct+'%' : '—'}</span>
    </div>`;

    if (state.prevWeek){
      html += `<div class="copy-banner">
        <span class="copy-text">Bring over last week's goals?</span>
        <button id="copyPrev">Copy them in</button>
        <button class="copy-dismiss" id="dismissCopy" aria-label="Dismiss">✕</button>
      </div>`;
    }

    if (total === 0){
      html += `<div class="empty-state">Nothing set for ${escapeHtml(activeDay)} yet — add what you want to get done.</div>`;
    } else {
      const groups = groupByCategory(list);
      groups.forEach(group => {
        html += `<div class="category-group">
          ${categoryHeading(group.category, 'daily')}
          <div class="goal-list" data-category="${escapeHtml(group.category)}">`;
        group.goals.forEach(g => {
          html += `<div class="goal-item ${g.routine?'routine-item':''}" data-id="${g.id}">
            <div class="goal-row">
              <button class="goal-check ${g.done?'checked':''}" data-id="${g.id}" aria-label="${g.done?'Mark not done':'Mark done'}"></button>
              ${state.editingGoalId===g.id
                ? `<input class="goal-edit-input" id="editInput" type="text" maxlength="140" value="${escapeHtml(g.text)}" data-id="${g.id}" />`
                : `<span class="goal-text ${g.done?'done':''}" data-id="${g.id}" title="Click to edit">${escapeHtml(g.text)}</span>`}
              ${g.routine
                ? `<button class="goal-move repeat ${state.movingGoalId===g.id?'open':''}" data-id="${g.id}" aria-label="Repeat settings" title="Repeats — click to change days">↻</button>`
                : `<button class="goal-move ${state.movingGoalId===g.id?'open':''}" data-id="${g.id}" aria-label="Repeat or move" title="Repeat or move">↻</button>`}
              <button class="goal-del" data-id="${g.id}" aria-label="Delete goal">✕</button>
            </div>`;
          if (state.movingGoalId === g.id && g.routine){
            html += `<div class="move-row"><span class="move-label">Repeats on</span>`;
            ALL_DAYS.forEach(d => {
              const on = g.days.includes(d);
              html += `<button class="move-day repeat-day ${on?'on':''}" data-id="${g.id}" data-target="${escapeHtml(d)}" ${on && g.days.length===1?'disabled':''}>${escapeHtml(d)}</button>`;
            });
            html += `<button class="move-day repeat-stop" data-id="${g.id}">Stop repeating</button></div>`;
          } else if (state.movingGoalId === g.id){
            html += `<div class="move-row"><span class="move-label">Repeat on</span>`;
            ALL_DAYS.forEach(d => {
              const on = d === g.day;
              html += `<button class="move-day repeat-pick ${on?'on':''}" data-id="${g.id}" data-target="${escapeHtml(d)}" ${on?'disabled':''}>${escapeHtml(d)}</button>`;
            });
            html += `</div><div class="move-row"><span class="move-label">Move to</span>`;
            DAYS[state.activeTab].forEach(d => {
              html += `<button class="move-day" data-id="${g.id}" data-target="${escapeHtml(d)}" ${d===g.day?'disabled':''}>${escapeHtml(d)}</button>`;
            });
            html += `</div>`;
          }
          html += `</div>`;
        });
        html += `</div></div>`;
      });
    }

    html += `<div class="add-form">
      <input class="add-input" id="goalInput" type="text" placeholder="What do you want to get done?" maxlength="140" />
      <div class="chip-row" id="chipRow"></div>
      <button class="add-submit ${state.activeTab}" id="addBtn">Add to ${escapeHtml(activeDay)}</button>
    </div>`;

    html += `<div class="status-note">Synced to your Google account. <button class="signout-link" id="signOutBtn">Sign out</button></div>`;

    app.innerHTML = html;
    renderChips();
    attachHandlers();
    initSortable();
  }

  let sortables = [];

  // Reads the day back from the DOM after a drag. The dragged goal takes the
  // category of the list it landed in (for a repeating goal, on every day),
  // one-off goals are re-appended in their new order, and the full on-screen
  // order, repeating goals included, is remembered for that day of the week.
  async function applyDragOrder(){
    const tab = state.activeTab;
    const activeDay = state.selectedDay[tab];
    const byId = new Map(state.week[tab].map(g => [g.id, g]));
    const reordered = [];
    const ids = [];
    let routinesChanged = false;
    document.querySelectorAll('.goal-list').forEach(listEl => {
      const category = listEl.getAttribute('data-category');
      listEl.querySelectorAll('.goal-item').forEach(item => {
        const id = item.getAttribute('data-id');
        ids.push(id);
        if (isRoutineId(id)){
          const r = routineById(id);
          if (r && r.category !== category){ r.category = category; routinesChanged = true; }
          return;
        }
        const g = byId.get(id);
        if (g){ g.category = category; reordered.push(g); }
      });
    });
    state.week[tab] = [...state.week[tab].filter(g => g.day !== activeDay), ...reordered];
    state.dayOrder[activeDay] = ids;
    await Promise.all([saveWeek(), saveDayOrder(), routinesChanged ? saveRoutines() : null]);
    render();
  }

  function initSortable(){
    sortables.forEach(s => s.destroy());
    sortables = [];
    if (!window.Sortable) return; // CDN unavailable — app still works, just no dragging
    document.querySelectorAll('.goal-list').forEach(el => {
      sortables.push(new Sortable(el, {
        group: 'goals',
        draggable: '.goal-item',
        animation: 150,
        // Touch has no HTML5 drag-and-drop, so it uses the fallback regardless;
        // forcing it on desktop too keeps the drag identical on both.
        forceFallback: true,
        fallbackTolerance: 4,
        // Touch needs a long-press, otherwise a drag would hijack page scrolling.
        delay: 200,
        delayOnTouchOnly: true,
        filter: '.goal-check, .goal-del, .goal-move, .move-row, .goal-edit-input',
        preventOnFilter: false,
        onEnd: applyDragOrder
      }));
    });

    document.querySelectorAll('.wk-list').forEach(wkList => {
      sortables.push(new Sortable(wkList, {
        group: 'weekly',
        draggable: '.wk-item',
        animation: 150,
        forceFallback: true,
        fallbackTolerance: 4,
        delay: 200,
        delayOnTouchOnly: true,
        filter: '.wk-check, .wk-del, .goal-edit-input',
        preventOnFilter: false,
        onEnd: async () => {
          // Dropping into another category's list moves the goal to that category.
          const byId = new Map(state.week.weekly.map(g => [g.id, g]));
          const reordered = [];
          document.querySelectorAll('.wk-list').forEach(l => {
            const category = l.getAttribute('data-category');
            l.querySelectorAll('.wk-item').forEach(el => {
              const g = byId.get(el.getAttribute('data-wid'));
              if (g){ g.category = category; reordered.push(g); }
            });
          });
          state.week.weekly = reordered;
          await saveWeek();
          render();
        }
      }));
    });
  }

  let chipSortable = null;

  function renderChips(){
    const chipRow = document.getElementById('chipRow');
    let html = '';
    state.categories.forEach(cat => {
      if (cat === state.editingChip){
        html += `<span class="chip-edit">
          <input class="chip-edit-input" id="chipEditInput" type="text" maxlength="24" value="${escapeHtml(cat)}" data-cat="${escapeHtml(cat)}" aria-label="Rename category" />
          <button type="button" class="chip-del" id="chipDeleteBtn" data-cat="${escapeHtml(cat)}" aria-label="Delete category" title="Delete category">✕</button>
        </span>`;
        return;
      }
      const sel = cat === state.selectedCategory && !state.addingCategory;
      html += `<button class="chip ${sel?'selected '+state.activeTab:''}" data-cat="${escapeHtml(cat)}" ${sel?'title="Click again to rename or delete"':''}>${escapeHtml(cat)}</button>`;
    });
    if (state.addingCategory){
      html += `<input class="chip-new-input" id="newCatInput" type="text" placeholder="Category name" maxlength="24" autofocus />`;
    } else {
      html += `<button class="chip" id="newCatChip">+ New</button>`;
    }
    if (chipSortable){ chipSortable.destroy(); chipSortable = null; }
    chipRow.innerHTML = html;
    if (window.Sortable && !state.editingChip){
      // Dragging the chips sets the category order used everywhere.
      chipSortable = new Sortable(chipRow, {
        draggable: '.chip[data-cat]',
        animation: 150,
        forceFallback: true,
        fallbackTolerance: 4,
        delay: 200,
        delayOnTouchOnly: true,
        filter: '#newCatChip, #newCatInput',
        preventOnFilter: false,
        onEnd: async () => {
          const next = [...chipRow.querySelectorAll('.chip[data-cat]')].map(b => b.getAttribute('data-cat'));
          if (next.join('\n') === state.categories.join('\n')) return;
          state.categories = next;
          await saveCategories();
          rerenderAll();
        }
      });
    }

    chipRow.querySelectorAll('.chip[data-cat]').forEach(btn => {
      btn.addEventListener('click', () => {
        const cat = btn.getAttribute('data-cat');
        // First click selects a category; clicking the selected one again edits it.
        if (cat === state.selectedCategory && !state.addingCategory){
          state.editingChip = cat;
          render();
          const inp = document.getElementById('chipEditInput');
          if (inp){ inp.focus(); inp.select(); }
          return;
        }
        state.selectedCategory = cat;
        state.addingCategory = false;
        render();
      });
    });

    const chipEdit = document.getElementById('chipEditInput');
    if (chipEdit){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; renameCategory(chipEdit.getAttribute('data-cat'), chipEdit.value); } };
      chipEdit.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ settled = true; state.editingChip = null; render(); }
      });
      chipEdit.addEventListener('blur', commit);
      const del = document.getElementById('chipDeleteBtn');
      // Keep focus in the field so its blur (which saves the name) doesn't fire first.
      del.addEventListener('mousedown', e => e.preventDefault());
      del.addEventListener('click', () => { settled = true; deleteCategory(del.getAttribute('data-cat')); });
    }
    const newChip = document.getElementById('newCatChip');
    if (newChip) newChip.addEventListener('click', () => {
      state.addingCategory = true;
      render();
      setTimeout(() => document.getElementById('newCatInput').focus(), 0);
    });
    const newInput = document.getElementById('newCatInput');
    if (newInput){
      newInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter'){ addCategory(newInput.value); }
        if (e.key === 'Escape'){ state.addingCategory = false; render(); }
      });
      newInput.addEventListener('blur', () => {
        if (newInput.value.trim()) addCategory(newInput.value);
        else { state.addingCategory = false; render(); }
      });
    }
  }

  function attachHandlers(){
    document.getElementById('prevWeek').addEventListener('click', () => goToWeek(-7));
    document.getElementById('nextWeek').addEventListener('click', () => goToWeek(7));
    document.getElementById('signOutBtn').addEventListener('click', () => auth.signOut());

    document.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => {
        state.activeTab = t.getAttribute('data-tab');
        state.selectedCategory = state.categories[0];
        state.movingGoalId = null;
        render();
      });
    });

    document.querySelectorAll('.day-btn').forEach(b => {
      b.addEventListener('click', () => {
        state.selectedDay[state.activeTab] = b.getAttribute('data-day');
        state.movingGoalId = null;
        render();
      });
    });

    const copyBtn = document.getElementById('copyPrev');
    if (copyBtn) copyBtn.addEventListener('click', copyPrevWeek);
    const dismissBtn = document.getElementById('dismissCopy');
    if (dismissBtn) dismissBtn.addEventListener('click', dismissCopyBanner);

    document.querySelectorAll('.goal-move').forEach(el => {
      el.addEventListener('click', () => {
        const id = el.getAttribute('data-id');
        state.movingGoalId = state.movingGoalId === id ? null : id;
        render();
      });
    });
    document.querySelectorAll('.move-day:not(.repeat-day):not(.repeat-pick):not(.repeat-stop)').forEach(el => {
      el.addEventListener('click', () => moveGoal(el.getAttribute('data-id'), el.getAttribute('data-target')));
    });
    document.querySelectorAll('.repeat-pick').forEach(el => {
      el.addEventListener('click', () => makeRepeating(el.getAttribute('data-id'), el.getAttribute('data-target')));
    });
    document.querySelectorAll('.repeat-day').forEach(el => {
      el.addEventListener('click', () => toggleRoutineDay(el.getAttribute('data-id'), el.getAttribute('data-target')));
    });
    document.querySelectorAll('.repeat-stop').forEach(el => {
      el.addEventListener('click', () => stopRepeating(el.getAttribute('data-id')));
    });

    document.querySelectorAll('.goal-list .goal-check').forEach(el => {
      el.addEventListener('click', () => toggleGoal(el.getAttribute('data-id')));
    });
    document.querySelectorAll('.goal-list .goal-text').forEach(el => {
      el.addEventListener('click', () => {
        state.editingGoalId = el.getAttribute('data-id');
        render();
        const inp = document.getElementById('editInput');
        if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    });

    const editInput = document.getElementById('editInput');
    if (editInput){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; saveGoalText(editInput.getAttribute('data-id'), editInput.value); } };
      editInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ settled = true; state.editingGoalId = null; render(); }
      });
      editInput.addEventListener('blur', commit);
    }
    document.querySelectorAll('.goal-list .goal-del').forEach(el => {
      el.addEventListener('click', () => deleteGoal(el.getAttribute('data-id')));
    });

    document.querySelectorAll('.wk-check').forEach(el => {
      el.addEventListener('click', () => toggleWeekly(el.getAttribute('data-wid')));
    });
    document.querySelectorAll('.wk-del').forEach(el => {
      el.addEventListener('click', () => deleteWeekly(el.getAttribute('data-wid')));
    });
    document.querySelectorAll('.wk-text').forEach(el => {
      el.addEventListener('click', () => {
        state.editingWeeklyId = el.getAttribute('data-wid');
        render();
        const inp = document.getElementById('weeklyEditInput');
        if (inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      });
    });
    const weeklyEdit = document.getElementById('weeklyEditInput');
    if (weeklyEdit){
      let settled = false;
      const commit = () => { if (!settled){ settled = true; saveWeeklyText(weeklyEdit.getAttribute('data-wid'), weeklyEdit.value); } };
      weeklyEdit.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') commit();
        if (e.key === 'Escape'){ settled = true; state.editingWeeklyId = null; render(); }
      });
      weeklyEdit.addEventListener('blur', commit);
    }
    const weeklyInput = document.getElementById('weeklyInput');
    weeklyInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addWeekly(weeklyInput.value);
    });
    wireMiniAdd(weeklyInput, cat => { state.weeklyCategory = cat; });
    wireCategoryHeads(app);

    const input = document.getElementById('goalInput');
    const addBtn = document.getElementById('addBtn');
    addBtn.addEventListener('click', () => {
      addGoal(input.value);
      input.value = '';
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){ addGoal(input.value); input.value=''; }
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  function showSignIn(){
    overallEl.hidden = true;
    overallEl.innerHTML = '';
    app.innerHTML = `<div class="signin">
      <div class="signin-title">Goals Tracker</div>
      <div class="signin-sub">Sign in to save your goals and sync them across devices.</div>
      <button id="googleSignIn" class="signin-btn">Sign in with Google</button>
    </div>`;
    document.getElementById('googleSignIn').addEventListener('click', () => {
      auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
        .catch(e => alert('Sign-in failed: ' + e.message));
    });
  }

  auth.onAuthStateChanged((user) => {
    if (user) init();
    else showSignIn();
  });
})();
</script>
</body>
</html>
